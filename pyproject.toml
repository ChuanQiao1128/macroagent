[project]
name = "macroagent"
version = "0.1.0"
description = "Confidence-aware nutrition accounting agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pillow>=11.0.0",
    "pillow-heif>=0.20.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
